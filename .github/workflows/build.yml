# Compiles the app on a Mac (no signing) on every push, so build errors show up here.
name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode (iOS 26 SDK, for Apple Intelligence)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "$X" && sudo xcode-select -s "$X" && echo "::notice::$(xcodebuild -version | tr "\n" " ")"
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project OOOILogger.xcodeproj -scheme OOOILogger \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Report (errors and warnings as annotations, so they show without the log)
        if: always()
        run: |
          grep -E "^/.*\.swift:[0-9]+:[0-9]+: error:" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l##*/OOOILogger/}"; done
          grep -E "^/.*\.swift:[0-9]+:[0-9]+: warning:" build.log | sort -u | head -20 | while IFS= read -r l; do echo "::warning::${l##*/OOOILogger/}"; done
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log | tail -1 | while IFS= read -r l; do echo "::notice::$l"; done
